name: Build news from Markdown

on:
  push:
    branches:
      - main
    paths:
      - "content/news/**"
      - "scripts/build-news.mjs"
      - "templates/news-article.html"
      - ".github/workflows/build-news.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate news pages
        run: node scripts/build-news.mjs

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news-data.json docs/news-data.json news docs/news
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "chore: build news pages from Markdown"
          git push
