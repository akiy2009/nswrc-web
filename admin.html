<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>入会申込管理 | NSWRC</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
.admin-wrap{max-width:1100px;margin:50px auto;padding:0 20px}.admin-panel{border:1px solid var(--line);padding:28px;background:#fff}.admin-panel input{padding:12px;border:1px solid var(--line);width:100%;margin:7px 0 14px}.admin-toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin:25px 0}.admin-table-wrap{overflow:auto}.admin-table{width:100%;border-collapse:collapse;font-size:12px}.admin-table th,.admin-table td{padding:12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.admin-table select{padding:7px;border:1px solid var(--line)}.admin-muted{color:var(--muted);font-size:12px}
</style></head><body><header class="header"><div class="container header-inner"><a class="brand" href="index.html"><img class="brand-logo" src="assets/nswrc-logo.svg" alt=""><span class="brand-copy"><span class="brand-name">全国学生無線通信研究会</span><span class="brand-en">MEMBERSHIP ADMINISTRATION</span></span></a></div></header>
<main class="admin-wrap"><p class="eyebrow">ADMINISTRATION</p><h1>入会申込管理</h1><section id="login" class="admin-panel"><h2>管理者ログイン</h2><p class="admin-muted">Supabase Authで管理者として登録されたアカウントのみ利用できます。</p><label>メールアドレス<input id="email" type="email" autocomplete="username"></label><label>パスワード<input id="password" type="password" autocomplete="current-password"></label><button id="login-button" class="button button-primary">ログイン</button><p id="login-error" role="alert"></p></section>
<section id="dashboard" hidden><div class="admin-toolbar"><p id="admin-count" class="admin-muted"></p><button id="logout" class="button button-text">ログアウト</button></div><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>申込日時</th><th>氏名・所属</th><th>連絡先</th><th>区分・関心</th><th>メッセージ</th><th>状態</th></tr></thead><tbody id="applications"></tbody></table></div></section><p id="admin-status" role="status" class="admin-muted"></p></main>
<script>
const SUPABASE_URL=window.NSWRC_SUPABASE_URL||"",SUPABASE_ANON_KEY=window.NSWRC_SUPABASE_ANON_KEY||"";
const API_BASE='https://nswrc-membership-git-main-gakusei-bot.vercel.app';
let client=null,accessToken=null;
const login=document.getElementById('login'),dashboard=document.getElementById('dashboard'),status=document.getElementById('admin-status');
if(SUPABASE_URL&&SUPABASE_ANON_KEY)client=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
document.getElementById('login-button').onclick=async()=>{if(!client){document.getElementById('login-error').textContent='Supabase URLとAnon Keyの設定が必要です。';return;}const {data,error}=await client.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});if(error){document.getElementById('login-error').textContent='ログインできません。入力内容を確認してください。';return;}accessToken=data.session.access_token;await load();};
async function api(method='GET',body){const r=await fetch(API_BASE+'/api/admin-applications',{method,headers:{Authorization:'Bearer '+accessToken,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw new Error(d.error||'API error');return d;}
async function load(){try{const d=await api();login.hidden=true;dashboard.hidden=false;document.getElementById('admin-count').textContent=d.applications.length+'件（最新200件）';const tbody=document.getElementById('applications');tbody.replaceChildren();for(const a of d.applications){const tr=document.createElement('tr');const values=[new Date(a.created_at).toLocaleString('ja-JP'),a.full_name+'\n'+a.affiliation,a.email,a.application_type+'\n'+(a.interests||[]).join(' / '),a.message];for(const v of values){const td=document.createElement('td');td.textContent=v;tr.append(td);}const td=document.createElement('td'),sel=document.createElement('select');for(const [v,l] of [['pending','未確認'],['reviewing','確認中'],['approved','承認'],['rejected','不承認'],['withdrawn','取下げ']]){const o=document.createElement('option');o.value=v;o.textContent=l;o.selected=a.status===v;sel.append(o);}sel.onchange=async()=>{try{await api('PATCH',{id:a.id,status:sel.value});status.textContent='状態を更新しました。';}catch(e){status.textContent=e.message;}};td.append(sel);tr.append(td);tbody.append(tr);}}catch(e){status.textContent=e.message;login.hidden=false;dashboard.hidden=true;}}
document.getElementById('logout').onclick=async()=>{await client?.auth.signOut();accessToken=null;dashboard.hidden=true;login.hidden=false;};
</script></body></html>
